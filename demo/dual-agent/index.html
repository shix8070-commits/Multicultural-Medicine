<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>临床助手 · 科研助手 · 我的论坛</title>
  <style>
    :root {
      --ink: #1d2430;
      --muted: #6b7380;
      --line: #e4e9f0;
      --blue: #3b82c4;
      --purple: #6b6ad6;
      --warn: #b42318;
      --warn-bg: #fdecea;
      --page-grad: linear-gradient(180deg, #c9e8ff 0%, #d5e2ff 38%, #e4dcff 72%, #ddd0ff 100%);
      --bar-grad: linear-gradient(90deg, #c5e8ff 0%, #c0ace8 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #d8e4f0;
      color: var(--ink);
      min-height: 100vh;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .phone {
      width: 390px;
      height: 844px;
      background: #111;
      border-radius: 44px;
      padding: 12px;
      box-shadow: 0 24px 60px rgba(30, 50, 80, .28);
    }
    .screen {
      height: 100%;
      border-radius: 34px;
      overflow: hidden;
      background: var(--page-grad);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px 0;
      font-size: 12px;
      font-weight: 650;
    }
    .wx-bar {
      height: 44px;
      display: grid;
      grid-template-columns: 36px 1fr 88px;
      align-items: center;
      padding: 0 8px 0 8px;
    }
    .wx-left { display: flex; align-items: center; gap: 6px; font-size: 18px; }
    .wx-left .menu-btn {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 2px;
      line-height: 1;
      color: inherit;
    }
    .drawer-mask {
      position: absolute;
      inset: 0;
      background: rgba(20, 30, 50, .35);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .drawer-mask.on { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 78%;
      max-width: 300px;
      background: var(--page-grad);
      z-index: 41;
      transform: translateX(-105%);
      transition: transform .22s ease;
      box-shadow: 8px 0 28px rgba(20, 30, 50, .18);
      display: flex;
      flex-direction: column;
      padding: 28px 16px 20px;
    }
    .drawer.on { transform: translateX(0); }
    .drawer-user {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 4px 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }
    .drawer-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(145deg, #8ec8f0, #8b7ee0);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }
    .drawer-user b { display: block; font-size: 16px; }
    .drawer-user span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
    .drawer-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-nav button {
      border: 0;
      background: rgba(255,255,255,.62);
      border-radius: 12px;
      padding: 14px 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-nav button em {
      font-style: normal;
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
    }
    .hit-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .hit-top b { flex: 1; }
    .star-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      color: #c5cad3;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .star-btn.on { color: #e6a817; }
    .badge {
      font-size: 10px;
      color: #7a8494;
      background: rgba(255,255,255,.7);
      border-radius: 8px;
      padding: 1px 6px;
    }
    .seg {
      display: flex;
      background: rgba(255,255,255,.4);
      border-radius: 18px;
      padding: 3px;
    }
    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 12px;
      color: #5c6573;
      padding: 6px 2px;
      border-radius: 15px;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg button.on {
      background: #fff;
      color: #1a1a1a;
      font-weight: 700;
      box-shadow: 0 1px 6px rgba(80,100,140,.14);
    }
    .capsule {
      justify-self: end;
      width: 86px;
      height: 30px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 15px;
      background: rgba(255,255,255,.88);
      display: flex;
      align-items: center;
      color: #333;
      overflow: hidden;
    }
    .capsule span {
      flex: 1;
      display: grid;
      place-items: center;
      height: 100%;
    }
    .capsule span:first-child {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 700;
      line-height: 1;
    }
    .capsule span + span {
      border-left: 1px solid rgba(0,0,0,.12);
    }
    .capsule .cap-dot {
      width: 12px;
      height: 12px;
      border: 1.6px solid #222;
      border-radius: 50%;
      box-sizing: border-box;
    }
    .body { flex: 1; overflow: auto; padding-bottom: 8px; }
    .hero {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px 14px;
    }
    .doc {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 18px;
      overflow: hidden;
      background: #7eb8b4;
    }
    .doc img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      display: block;
    }
    .hello { font-size: 22px; font-weight: 750; letter-spacing: .02em; }
    .hello span { font-size: 14px; font-weight: 400; color: #4a5565; display: block; margin-top: 4px; line-height: 1.4; }
    .mods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 14px 16px;
    }
    .mod {
      border: 0;
      background: rgba(255,255,255,.78);
      border-radius: 16px;
      padding: 14px 6px 12px;
      cursor: pointer;
      font: inherit;
      text-align: center;
    }
    .mod .ico {
      width: 42px;
      height: 42px;
      margin: 0 auto 8px;
      border-radius: 12px;
      background: #e8f4ff;
      color: var(--blue);
      display: grid;
      place-items: center;
    }
    .mod b { display: block; font-size: 13px; font-weight: 650; }
    .sec {
      padding: 0 16px 12px;
    }
    .sec-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .sec-h button {
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .q {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 0;
      border-radius: 16px;
      padding: 13px 14px;
      margin-bottom: 8px;
      font: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      box-shadow: 0 1px 0 rgba(255,255,255,.8);
    }
    .hash {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: #ecebff;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q .go { margin-left: auto; color: #c5cad3; font-size: 16px; }
    .new-chat {
      width: 72%;
      min-height: 72px;
      margin: 0 auto;
      border: 0;
      background: #fff;
      border-radius: 16px;
      cursor: pointer;
      font: inherit;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .new-chat .plus-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--blue);
      color: var(--blue);
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
      font-weight: 400;
    }
    .new-chat b { font-size: 13px; font-weight: 650; }
    .dock {
      padding: 6px 12px 14px;
      background: linear-gradient(180deg, transparent, rgba(228, 220, 255, .88) 32%);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .chips button {
      border: 0;
      background: var(--bar-grad);
      border-radius: 16px;
      padding: 7px 12px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #334;
    }
    .chips button.on {
      background: #dbeafe;
      color: #1e40af;
    }
    .inputbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 22px;
      padding: 8px 10px 8px 12px;
    }
    .inputbar input {
      flex: 1;
      border: 0;
      outline: none;
      font: inherit;
      font-size: 14px;
      background: transparent;
    }
    .plus {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid #c5cad3;
      background: #fff;
      color: #666;
      font-size: 18px;
      line-height: 24px;
      cursor: pointer;
    }
    .sub {
      background: transparent;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .sub .nav {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .sub .nav button { border: 0; background: none; font-size: 22px; cursor: pointer; width: 28px; }
    .sub .pad { flex: 1; overflow: auto; padding: 12px 14px 20px; background: transparent; }
    .search {
      display: flex;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin-bottom: 10px;
    }
    .search input { flex: 1; border: 0; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; }
    .search button { border: 0; background: var(--blue); color: #fff; padding: 0 14px; font-weight: 700; cursor: pointer; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .filters button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .filters button.on { border-color: var(--blue); background: #e8f4ff; color: var(--blue); font-weight: 700; }
    .lit-tabs {
      display: flex;
      gap: 0;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .lit-tabs button {
      border: 0;
      background: transparent;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }
    .lit-tabs button.on { color: var(--blue); font-weight: 700; }
    .lit-tabs button.on::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 2px;
      background: var(--blue);
      border-radius: 1px;
    }
    .lit-cat-panel {
      position: absolute;
      left: 14px;
      right: 14px;
      top: calc(100% - 4px);
      background: #fff;
      border-radius: 12px;
      z-index: 7;
      padding: 10px;
      box-shadow: 0 8px 28px rgba(20, 30, 50, .16);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .lit-cat-panel button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 8px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .lit-cat-panel button.on { border-color: var(--blue); background: #f3f8ff; color: var(--blue); font-weight: 700; }
    .lit-cat-panel button em { display: block; font-style: normal; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .lit-filter-panel {
      background: #fff;
      padding: 12px 14px 80px;
      flex: 1;
      overflow: auto;
    }
    .lit-filter-panel h4 { font-size: 13px; margin-bottom: 8px; color: var(--ink); }
    .lit-filter-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .lit-filter-tags button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      color: #334;
    }
    .lit-filter-tags button.on { border-color: var(--blue); background: #e8f4ff; color: var(--blue); font-weight: 650; }
    .lit-filter-foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 12px 14px 20px;
      background: #fff;
      border-top: 1px solid var(--line);
    }
    .lit-filter-foot button {
      flex: 1;
      border-radius: 10px;
      padding: 11px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .lit-filter-foot .ghost { border: 1px solid var(--line); background: #fff; color: #334; }
    .lit-filter-foot .primary { border: 0; background: var(--blue); color: #fff; }
    .lit-hint { padding: 24px 14px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .lit-result-head { padding: 10px 14px 0; font-size: 12px; color: var(--muted); }
    .grade-tag {
      display: inline-block;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 4px;
    }
    .grade-L4, .grade-L5 { background: #fef3c7; color: #92400e; }
    .grade-L6, .grade-L7 { background: #ffedd5; color: #9a3412; }
    .grade-L1 { background: #fee2e2; color: #991b1b; }
    .grade-L2, .grade-L3 { background: #ffedd5; color: #c2410c; }
    .grade-L8 { background: #dcfce7; color: #166534; }
    .grade-L9 { background: #f3f4f6; color: #6b7280; }
    .doc-tag { display: inline-block; background: #eef1f6; color: #556; border-radius: 6px; padding: 2px 7px; font-size: 10px; margin-right: 4px; }
    .statrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .stat {
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .stat em { font-style: normal; font-size: 12px; color: var(--muted); display: block; }
    .stat strong { font-size: 20px; }
    .hit {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      font: inherit;
    }
    .hit b { display: block; font-size: 14px; margin-bottom: 4px; }
    .hit p { font-size: 13px; color: #333; line-height: 1.45; }
    .hit .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .reply-prose { font-size: 14px; line-height: 1.7; color: #333; }
    .reply-prose p { margin: 0 0 12px; }
    .reply-prose p:last-child { margin-bottom: 0; }
    .reply-prose h4 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      color: #64748b;
      margin: 16px 0 8px;
    }
    .reply-prose h4:first-child { margin-top: 0; }
    .reply-prose strong { color: #1e293b; }
    .reply-summary {
      font-size: 15px;
      line-height: 1.65;
      margin: 0 0 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 10px;
      border-left: 3px solid #93c5fd;
    }
    .reply-point {
      font-size: 13.5px;
      line-height: 1.7;
      color: #334155;
      margin: 0 0 12px;
    }
    .cite-foot {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(180, 190, 210, .35);
    }
    .cite-foot-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .cite-chip {
      display: inline-block;
      border: 0;
      background: #eef2f7;
      color: #4a5568;
      font: inherit;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      margin: 0 6px 6px 0;
      cursor: pointer;
    }
    .cite-chip:hover { background: #dbeafe; color: #1e40af; }
    .evidence-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 10px 0;
      padding: 10px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 12px;
    }
    .evidence-mini span { display: block; }
    .evidence-mini em { font-style: normal; color: var(--muted); font-size: 11px; }
    .evidence-mini strong { font-size: 13px; color: var(--ink); }
    .evidence-mini small { font-size: 10px; color: #9a3412; }
    .warn {
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .chat { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
    .bubble {
      max-width: 82%;
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .bubble.me { align-self: flex-end; background: #c9e7ff; }
    .bubble.pending { color: var(--muted); }
    .llm-status {
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .llm-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9aa3ad;
      flex-shrink: 0;
    }
    .llm-dot.on { background: #2f9e44; }
    .keys {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0 2px;
    }
    .keys span {
      background: #e8f4ff;
      color: #2a5f8f;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 650;
    }
    .tag-mute {
      display: inline-block;
      background: #eef1f6;
      color: #6b7380;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 650;
      margin-right: 4px;
    }
    .suggest { display: flex; flex-wrap: wrap; gap: 6px; }
    .suggest button {
      border: 1px solid #d0d0d0; background: #fff; border-radius: 14px;
      padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; color: #333; text-align: left;
    }
    .mode-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bar-grad);
      color: var(--ink);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .mode-chip .end {
      margin-left: auto;
      border: 0;
      background: rgba(255,255,255,.22);
      color: #fff;
      border-radius: 8px;
      padding: 4px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-chip .x {
      margin-left: 0;
      border: 0;
      background: transparent;
      color: #4a4258;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .mode-chip .x.alone { margin-left: auto; }
    .home-chat { padding: 8px 12px 4px; display: flex; flex-direction: column; gap: 10px; min-height: 280px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .sbar {
      display: flex;
      align-items: center;
      background: #f3f5f8;
      border-radius: 10px;
      padding: 4px 4px 4px 4px;
      margin: 10px 14px 0;
      position: relative;
    }
    .sbar .drop {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      padding: 8px 8px;
      border-right: 1px solid #dde3ea;
      white-space: nowrap;
      cursor: pointer;
      border: 0;
      background: transparent;

      let rows = LIT_ENTRIES.slice();
      if (shelf) rows = rows.filter((e) => e.shelf === shelf);
      if (docTypes && docTypes.length) rows = rows.filter((e) => docTypes.includes(e.docType));
      return rows;

    function litSearchRows() {
      let rows = litRowsByFilter(state.litShelf, state.litDocTypes);
      if (state.litGrade === "mid") rows = rows.filter((e) => ["L4", "L5"].includes(e.grade));
      else if (state.litGrade === "low") rows = rows.filter((e) => ["L6", "L7", "L8"].includes(e.grade));
      const q = (state.query || "").trim();
      if (!q) return rows;
      const ql = q.toLowerCase();
      return rows.filter((e) => {
        const blob = [e.ethnicity, e.topic, e.title, e.conclusion, e.mes, e.picos.P, e.picos.I, e.picos.O].join(" ");
        return blob.includes(q) || blob.toLowerCase().includes(ql);
      });
    }
    function litKeywordHints() {
      const rows = litRowsByFilter(state.litShelf, state.litDocTypes);
      const hints = [];
      const seen = {};
      rows.forEach((e) => {
        e.topic.split(/[、，,]/).forEach((t) => {
          const w = t.trim();
          if (!w || seen[w]) return;
          seen[w] = true;
          const n = rows.filter((r) => (r.topic + r.conclusion + r.ethnicity).includes(w)).length;
          hints.push({ label: w, n });
        });
        if (!seen[e.ethnicity]) {
          seen[e.ethnicity] = true;
          const n = rows.filter((r) => r.ethnicity === e.ethnicity).length;
          hints.push({ label: e.ethnicity, n });
        }
      });
      return hints.slice(0, 5);
    }

    function matchLit(eth, topic, text) {
      let rows = LIT_ENTRIES.slice();
      if (eth) {
        rows = rows.filter((e) => e.ethnicity === eth || e.ethnicity.includes(eth) || eth.includes(e.ethnicity.replace(/族$/, "")));
      }
      if (topic) {
        rows = rows.filter((e) => {
          const blob = [e.topic, e.title, e.conclusion, e.picos.P, e.picos.I, e.picos.O, e.picos.S].join(" ");
          if (blob.includes(topic)) return true;
          if (topic === "华法林") return /华法林|抗凝|CYP2C9|VKORC1|出血/.test(blob);
          if (topic === "心血管肾脏代谢综合征") return /代谢|CKM|心血管/.test(blob);
          if (topic === "高血压") return /高血压/.test(blob);
          return false;
        });
      }
      const q = (text || "").trim();
      if (q && (!eth || !topic)) {
        const picked = rows.filter((e) => {
          const blob = [e.ethnicity, e.topic, e.title, e.conclusion, e.mes].join(" ");
          return q.split(/[\s，,、]+/).filter((w) => w.length >= 2).some((w) => blob.includes(w));
        });
        if (picked.length) rows = picked;
      }
      return rows;
    }

    function matchResearch(eth, topic, text) {
      const lit = matchLit(eth, topic, text);
      const legacy = match(eth, topic);
      const seen = new Set(lit.map((e) => e.id));
      return lit.concat(legacy.filter((e) => !seen.has(e.id)));
    }

    function match(eth, topic) {
      return ENTRIES.filter((e) => {
        if (eth && e.ethnicity !== eth) return false;
        if (topic && e.topic !== topic) return false;
        return true;
      });
    }

    function countBy(rows, key) {
      const map = {};
      rows.forEach((e) => { map[e[key]] = (map[e[key]] || 0) + 1; });
      return Object.entries(map).map(([name, n]) => ({ name, n }));
    }

    function litRows() {
      const d = parse(state.query);
      let rows = ENTRIES.slice();
      if (state.query && (d.eth || d.topic)) {
        if (d.eth) rows = rows.filter((e) => e.ethnicity === d.eth);
        if (d.topic) rows = rows.filter((e) => e.topic === d.topic);
        return rows;
      }
      if (SHELVES.some((s) => s[0] === state.litAxis)) {
        rows = rows.filter((e) => e.shelf === state.litAxis);
        if (state.litPick) rows = rows.filter((e) => e.ethnicity === state.litPick);
      }
      return rows;
    }

    function litGroups() {
      if (state.litPick || state.query) return null;
      if (!SHELVES.some((s) => s[0] === state.litAxis)) return null;
      const rows = ENTRIES.filter((e) => e.shelf === state.litAxis);
      return { title: shelfName(state.litAxis) + " · 按民族", unit: "这个民族", items: countBy(rows, "ethnicity") };
    }

    function parse(text) {
      const d = { eth: "", topic: "" };
      if (text.includes("傣")) d.eth = "傣族";
      else if (text.includes("白")) d.eth = "白族";
      else if (text.includes("哈尼")) d.eth = "哈尼族";
      else if (text.includes("傈僳")) d.eth = "傈僳族";
      else if (text.includes("普米")) d.eth = "普米族";
      else if (text.includes("佤")) d.eth = "佤族";
      else if (text.includes("维")) d.eth = "维吾尔族";
      else if (text.includes("云南")) d.eth = "云南多民族";
      else if (text.includes("多民族") || text.includes("各民族")) d.eth = "多民族";
      if (text.includes("华法林") || text.includes("出血") || text.includes("抗凝")) d.topic = "华法林";
      else if (text.includes("G6PD")) d.topic = "G6PD基因变异";
      else if (text.includes("药物基因") || text.includes("药物基因组")) d.topic = "药物基因组变异";
      else if (text.includes("STR")) d.topic = "STR基因座";
      else if (text.includes("Y染色体") || text.includes("YAP")) d.topic = "Y染色体YAP位点";
      else if (text.includes("全基因组")) d.topic = "全基因组变异";
      else if (text.includes("基因组")) d.topic = "基因组变异";
      else if (text.includes("糖尿病")) d.topic = "糖尿病";
      else if (text.includes("瓣膜")) d.topic = "心脏瓣膜病";
      else if (text.includes("NAFLD") || text.includes("脂肪肝") || text.includes("肥胖")) d.topic = "NAFLD及肥胖";
      else if (text.includes("儿童") || (text.includes("高血压") && text.includes("青少年"))) d.topic = "儿童青少年高血压";
      else if (text.includes("高血压")) d.topic = "高血压";
      else if (text.includes("代谢") || text.includes("心血管") || text.includes("CKM")) d.topic = "心血管肾脏代谢综合征";
      return d;
    }

    function refuse(text) {
      return /怎么治|该怎么用药|改药|剂量怎么开|开什么药|处方怎么写|确诊是什么/.test(text);
    }

    function refuseHtml() {
      if (state.assistant === "research") {
        return `<div class="warn">本助手不回答个体诊疗问题。</div>
          <p>不提供如何治疗、开具何种药物、如何调整剂量或是否确诊等意见。</p>

          <p class="note">诊疗问题请转临床助手；临床助手亦不替代诊疗。医生仍须完成问诊与检查，并依据指南与个体情况处置。</p>`;
      }

        <p>不提供如何治疗、开具何种药物、如何调整剂量或是否确诊等意见。</p>

        <p class="note">医生仍须完成问诊与检查，并依据指南与个体情况处置。</p>`;

    function compareLabel(rows) {
      if (!rows.length) return "现有材料不足以判断";
      if (rows.every((e) => e.comparable === "不能横比")) return "不宜跨民族套用";
      return "跨民族套用须谨慎";
    }

    function missingDimsNote(dims, warn) {
      const missing = [];
      if (!dims.eth) missing.push("民族/人群");
      if (!dims.topic) missing.push("疾病或药物");
      if (!missing.length) return "";
      return `<div class="warn">${warn}</div>
        <div class="hit"><b>尚缺关键维度</b>
          <p>请补充：${missing.join("、")}。缺项时只追问所缺项，不臆补。</p>
        </div>`;
    }

    function evidenceGradeSummary(rows) {
      if (!rows.length) return { dist: "无", verdict: "几乎无发表证据", level: "empty" };
      const dist = {};
      rows.forEach((e) => {
        const label = e.gradeName
          ? e.gradeName.replace(/\s.*/, "")
          : (e.type || "未分级");
        dist[label] = (dist[label] || 0) + 1;
      });
      const distText = Object.entries(dist).map(([k, v]) => `${k} ${v} 条`).join("、");
      const lowOnly = rows.every((e) =>
        !e.grade
        || ["L5", "L6", "L7", "L8", "L9"].includes(e.grade)
        || /横断面|观察|基础|病例/.test(e.type || e.gradeName || "")
      );
      const verdict = lowOnly
        ? "整体偏低，多为观察或描述性研究"
        : "有一定发表基础，仍须逐条核对设计与样本";
      return { dist: distText, verdict, level: lowOnly ? "low" : "mid" };
    }

    function evidenceMiniHtml(rows, sc) {
      const n = rows.length;
      const g = evidenceGradeSummary(rows);
      return `<div class="evidence-mini">
        <span><em>入库文献</em><strong>${n}</strong> 条</span>
        <span><em>证据强弱</em><strong>${n ? (g.level === "low" ? "偏低" : "须核对") : "无"}</strong></span>
        <span><em>等级分布</em><strong style="font-size:11px;font-weight:600">${g.dist}</strong></span>
        ${sc != null ? `<span><em>现场信号</em><strong>${sc}</strong> 笔 <small>非证据</small></span>` : ""}
      </div>`;
    }

    function typeDist(rows) {
      const types = {};
      rows.forEach((e) => { types[e.type] = (types[e.type] || 0) + 1; });
      return Object.keys(types).length
        ? Object.entries(types).map(([k, v]) => k + v + "条").join("、")
        : "无";
    }

    function citeHit(e) {
      return `<div class="hit">
        <b>${e.topic} · ${e.ethnicity}</b>
        <p>${e.conclusion}</p>
        <div class="kv" style="margin-top:8px;font-size:12px">
          <em>作用</em><span>${e.role}</span>
          <em>民族/人群</em><span>${e.population}</span>
          <em>药或病/现象</em><span>${e.phen}</span>
          <em>基因</em><span>${e.gene || "无"}</span>

          <em>研究类型</em><span>${e.type}</span>
          <em>适用范围</em><span>${e.scope}</span>

    function litTypeDist(rows) {
      const types = {};
      rows.forEach((e) => {
        const t = e.gradeName ? e.gradeName.replace(/^L\d+\s*/, "") : docTypeName(e.docType);
        types[t] = (types[t] || 0) + 1;
      });
      return Object.keys(types).length
        ? Object.entries(types).map(([k, v]) => k + " " + v + " 条").join("、")
        : "无";
    }

    function citeLabel(e) {
      return e.mes || e.rec || ("#" + e.id);
    }

    function citeFoot(rows, limit) {
      const list = (rows || []).slice(0, limit || 5);
      if (!list.length) return "";
      return `<div class="cite-foot">
        <span class="cite-foot-label">参考来源</span>
        ${list.map((e, i) => {
          const title = (e.title || e.recTitle || e.topic || "").replace(/"/g, "'");
          return `<button type="button" class="cite-chip" data-lit-open="${e.id}" title="${title}">[${i + 1}] ${citeLabel(e)}</button>`;
        }).join("")}
      </div>`;
    }

    function clinicReplyWrap(bodyHtml, rows, tail) {
      return `<div class="reply-prose">${bodyHtml}</div>${citeFoot(rows)}${tail || ""}`;
    }

    function judgeHtml(rows, dims) {
      const miss = missingDimsNote(dims, "辅助判断不等于诊断。本助手只说明现有公开研究知道多少，不判断这个病人得了什么、该如何处置。");
      if (miss) return miss;
      const n = rows.length;
      const weak = n <= 2;
      const typeText = litTypeDist(rows);
      const focus = `${dims.eth} · ${dims.topic}`;
      let lead = "";
      let detail = "";
      if (n === 0) {
        lead = `关于<strong>${focus}</strong>，库里目前<strong>几乎没有</strong>对上的公开材料。`;
        detail = `<p>不宜把全国或汉族结论直接套用到该民族。就现有入库情况看，<strong>材料不足以支撑临床对照</strong>，不能当作医嘱依据。</p>
          <p>您仍须完成问诊、检查，并依据指南与个体情况处置。</p>`;
      } else if (weak) {
        lead = `关于<strong>${focus}</strong>，库里目前有 <strong>${n}</strong> 条相关材料，整体<strong>偏少</strong>。`;
        detail = `<p>现有条目以${typeText}为主，证据强度有限，<strong>尚不足以支撑临床决策</strong>——仅供了解方向，不能替代个体判断。</p>
          <p>${rows[0].conclusion.length > 72 ? rows[0].conclusion.slice(0, 72) + "…" : rows[0].conclusion}</p>
          <p>跨民族套用须谨慎。您仍须完成问诊、检查，并依据指南处置。</p>`;
      } else {
        lead = `关于<strong>${focus}</strong>，库里目前有 <strong>${n}</strong> 条公开发表材料，可以作<strong>初步对照</strong>。`;
        detail = `<p>材料类型包括：${typeText}。仍以调查或观察为主，<strong>不能替代个体诊疗</strong>，但比「完全没有」更有参考意义。</p>
          <p>建议结合下方来源核对 PICOS 和适用边界，再决定如何在接诊中使用。</p>`;
      }
      const tail = weak && n
        ? `<p class="note" style="margin-top:10px">若接诊中确有此类现象，可用「开始新对话」写入脱敏观察，供科研端统计。</p>`
        : "";
      return clinicReplyWrap(`<p class="reply-summary">${lead}</p>${detail}`, rows, tail);
    }

    function frontierReply(dims, rows) {
      const focus = dims.eth || dims.topic
        ? `${dims.eth || "—"}${dims.eth && dims.topic ? " · " : ""}${dims.topic || "—"}`
        : "您关心的方向";
      const n = rows.length;
      let body = "";
      if (!n) {
        body = `<p class="reply-summary">关于<strong>${focus}</strong>，库内<strong>暂无</strong>对上的入库条目。</p>
          <p>这不代表全网没有研究，只是本库尚未收录。您可以换关键词，或去「文献速查」按主题浏览。</p>
          <p>若您能提供民族和病/药，我可以帮您对照得更准。</p>`;
        return clinicReplyWrap(body, rows);
      }
      const shelves = {};
      rows.forEach((e) => { shelves[shelfName(e.shelf)] = (shelves[shelfName(e.shelf)] || 0) + 1; });
      const shelfText = Object.entries(shelves).map(([k, v]) => k + " " + v + " 条").join("、");
      const themes = [...new Set(rows.map((e) => e.topic.split(/[、，,]/)[0].trim()))].slice(0, 3).join("、");
      body = `<p class="reply-summary">关于<strong>${focus}</strong>，库内目前有 <strong>${n}</strong> 条相关入库材料，集中在<strong>${themes || "该主题"}</strong>方向。</p>
        <p>按主题分布：${shelfText}。现有研究以${litTypeDist(rows)}为主。</p>
        <p>${rows[0].conclusion.length > 80 ? rows[0].conclusion.slice(0, 80) + "…" : rows[0].conclusion}</p>
        <p>本答复限于库内已入库条目，按编号排列，非实时全网检索。要核对 PICOS 和 DOI，可点下方来源或去文献速查。</p>`;
      return clinicReplyWrap(body, rows);
    }

    function extractPhen(text) {
      if (/出血/.test(text)) return "出血相关现象";
      if (/抗凝/.test(text)) return "抗凝相关现象";
      if (/代谢|心血管|CKM/.test(text)) return "代谢相关聚集";
      if (/基因/.test(text)) return "药物基因组相关现象";
      const t = (text || "").replace(/\s+/g, " ").trim();
      return t.length > 28 ? t.slice(0, 28) + "…" : (t || "接诊中观察到的现象");
    }

    function shelfForQuery(d) {
      if (d.topic === "华法林" || d.topic === "药物基因组变异" || d.topic === "药物基因位点") return "pgx";
      if (d.topic === "G6PD基因变异" || d.topic === "全基因组变异" || d.topic === "基因组变异" || d.topic === "STR基因座" || d.topic === "Y染色体YAP位点") return "geno";
      if (/危险|因素/.test(state.query || "")) return "risk";
      return "prev";
    }
    function go(page) {
      if (page === "lit") {
        state.query = "";
        state.litPick = "";
        state.litAxis = "prev";
        state.litDrop = false;
        state.litDetailId = null;
        state.litStep = 1;
        state.litShelf = "";
        state.litDocTypes = [];
        state.litShowResults = false;
        state.litFilterOpen = false;
        state.litGrade = "";
      }
      if (page === "history") {
        state.historyId = null;
        if (!state.historyTab) state.historyTab = "talk";
      }
      if (page === "favorites") {
        state.favAxis = "all";
        state.favPick = "";
        state.drawerOpen = false;
      }
      if (page === "home") {
        if (!state.caseLive && !state.judgeLive) {

        }
      }

    function startCaseSession() {
      state.llmSeq += 1;
      const closed = state.caseLive ? finishCaseSession() : null;
      state.assistant = "clinic";
      state.page = "home";
      state.chatMode = "case";
      state.caseLive = true;
      state.pendingSignal = null;
      state.historyId = closed ? closed.id : null;
      state.tips = [];
      const lead = closed
        ? `上一条（${closed.eth} · ${closed.topic}）已结束并写入对话记录。这是新的一条，请继续说接诊情况。说完再点一次「开始新对话」。`
        : "对话已开始。在下方输入接诊情况（民族、病/药、现象）。说完再点一次「开始新对话」，这条会写入记录并开下一条。";
      state.msgs = [{ role: "bot", html: lead }];
      render();
    }

    function caseLiveAck(text, dims) {
      const gotEth = !!dims.eth;
      const gotTopic = !!dims.topic;
      if (!gotEth && !gotTopic) {
        return "记下了。请尽量带上<strong>哪个民族</strong>、和<strong>什么病/药</strong>有关。说完再点一次「开始新对话」。";
      }
      if (!gotEth) return "病/药相关信息有了。还差<strong>民族</strong>的话补一句；否则也可以再点一次「开始新对话」。";
      if (!gotTopic) return "民族有了。还差<strong>病或药</strong>的话补一句；否则也可以再点一次「开始新对话」。";
      return `收到：${dims.eth} · ${dims.topic}。可以继续补充现象，或再点一次「开始新对话」让我按整段记录总结。`;
    }

    function finishCaseSession() {
      if (!state.caseLive) return null;
      const doctorLines = state.msgs.filter((m) => m.role === "me").map((m) => m.text || "").filter(Boolean);
      state.caseLive = false;
      state.chatMode = "";
      if (!doctorLines.length) return null;
      const transcript = doctorLines.join("；");
      const d = parse(transcript);
      const dims = { eth: d.eth || "", topic: d.topic || "" };
      if (d.eth) state.eth = d.eth;
      if (d.topic) state.topic = d.topic;
      const phen = extractPhen(transcript);
      const n = match(dims.eth, dims.topic).length;
      const ready = !!(dims.eth && dims.topic);
      const isRed = false;
      const gap = !ready ? "信息不全" : n === 0 ? "文献缺口" : n <= 2 ? "证据偏弱" : "已有若干";
      const id = "c" + Date.now();
      const record = {
        id,
        time: new Date().toISOString().slice(0, 10),
        eth: dims.eth || "未点明",
        topic: dims.topic || "未点明",
        phen,
        lit: n,
        gap,
        isRed,
        uploaded: false,
        uploadTime: null,
        lines: doctorLines.slice(),
        summaryHtml: ""
      };
      record.summaryHtml = caseReply(transcript, dims, match(dims.eth, dims.topic), id);
      state.caseHistory.unshift(record);
      persistCases();
      state.historyTab = "talk";
      return record;
    }

    function startJudgeSession() {
      state.llmSeq += 1;
      const closed = state.judgeLive ? finishJudgeSession() : null;
      state.assistant = "research";
      state.page = "home";
      state.chatMode = "decide";
      state.judgeLive = true;
      state.caseLive = false;
      state.judgeId = closed ? closed.id : null;
      state.tips = [];
      const lead = closed
        ? `上一条（${closed.eth} · ${closed.topic}）已结束并写入研判记录。这是新的一条，请说明要判断的民族 + 病/药。说完再点一次「开始新对话」。`
        : "研判对话已开始。请说明要判断的<strong>民族 + 病/药</strong>（例如：傣族华法林，做还是不做？）。说完再点一次「开始新对话」，这条会写入研判记录并开下一条。";
      state.msgs = [{ role: "bot", html: lead }];
      render();
    }

    function judgeLiveAck(text, dims) {
      const gotEth = !!dims.eth;
      const gotTopic = !!dims.topic;
      if (!gotEth && !gotTopic) {
        return "记下了。请带上<strong>哪个民族</strong>和<strong>什么病/药</strong>。说完再点一次「开始新对话」。";
      }
      if (!gotEth) return "主题有了。还差<strong>民族</strong>的话补一句；否则也可以再点一次「开始新对话」。";
      if (!gotTopic) return "民族有了。还差<strong>病或药</strong>的话补一句；否则也可以再点一次「开始新对话」。";
      return `收到：${dims.eth} · ${dims.topic}。可继续补充问题，或再点一次「开始新对话」生成研判结论。`;
    }

    function finishJudgeSession() {
      if (!state.judgeLive) return null;
      const lines = state.msgs.filter((m) => m.role === "me").map((m) => m.text || "").filter(Boolean);
      state.judgeLive = false;
      state.chatMode = "";
      if (!lines.length) return null;
      const transcript = lines.join("；");
      const d = parse(transcript);
      const dims = { eth: d.eth || "", topic: d.topic || "" };
      if (d.eth) state.eth = d.eth;
      if (d.topic) state.topic = d.topic;
      const rows = matchResearch(dims.eth, dims.topic, transcript);
      const summary = decideReply(dims, rows);
      const choice = state.lastJudgement || "现在还说不清";
      const sc = signalCount(dims.eth, dims.topic);
      const lit = rows.length;
      const id = "j" + Date.now();
      const record = {
        id,
        time: new Date().toISOString().slice(0, 10),
        eth: dims.eth || "未点明",
        topic: dims.topic || "未点明",
        choice,
        sc,
        lit,
        lines: lines.slice(),
        summaryHtml: summary
      };
      state.judgeHistory.unshift(record);
      persistJudges();
      return record;
    }

    function persistJudges() {
      try { localStorage.setItem("minzheng-judges-v1", JSON.stringify(state.judgeHistory)); } catch (e) {}
    }
    (function loadJudges() {
      try {
        const raw = JSON.parse(localStorage.getItem("minzheng-judges-v1") || "null");
        if (raw && raw.length) state.judgeHistory = raw;
      } catch (e) {}
    })();

    function llmStatusLine() {
      const s = state.llmStatus;
      if (!s.checked) return `<div class="llm-status"><span class="llm-dot"></span>正在连接模型…</div>`;
      if (s.ok && !s.mock) return `<div class="llm-status"><span class="llm-dot on"></span>${s.model || "deepseek-v4-flash"}</div>`;
      if (s.ok && s.mock) return `<div class="llm-status"><span class="llm-dot"></span>未配置 Key，先用本地对照</div>`;
      return `<div class="llm-status"><span class="llm-dot"></span>未连上模型，先用本地对照</div>`;
    }

    function probeLlm() {
      fetch("/api/health").then((r) => r.json()).then((d) => {
        state.llmStatus = {
          checked: true,
          ok: !!d.ok,
          model: d.model || "deepseek-v4-flash",
          mock: !!d.mock
        };
        const el = document.querySelector(".llm-status");
        if (el) el.outerHTML = llmStatusLine();
      }).catch(() => {
        state.llmStatus = { checked: true, ok: false, model: "", mock: true };
        const el = document.querySelector(".llm-status");
        if (el) el.outerHTML = llmStatusLine();
      });
    }

    function promptPack(kind, mode) {
      const p = kind === "research" ? RESEARCH_PROMPT : CLINIC_PROMPT;
      const extra = kind === "research"
        ? (mode === "evidence" ? (p.structureEvidence || p.structure)
          : mode === "topic" ? (p.structureTopic || p.structure)
          : (p.structureDecide || p.structure))
        : (mode === "frontier" ? (p.structureFrontier || p.structure) : (p.structureJudge || p.structure));
      return [
        p.role,
        "范围：" + p.scope,
        "规则：\n- " + (p.rules || []).join("\n- "),
        "禁止：\n- " + (p.bans || []).join("\n- "),
        "结构：\n- " + extra.join("\n- "),
        "输出要求：用简洁中文。先写小标题「判断摘要」，空一行后再写小标题「理由」。判断摘要可分成两段：首句给结论，随后另起一段写覆盖情况。理由每条单独成段、单独一行，不要在句首写短横杠、项目符号或编号。可用 **加粗**。不要写 HTML。不要编造 MES 编号或文献结论。不要写「参考来源」「参考文献」或编号清单（前端会附真实可点击来源）。不要提及现场信号、脱敏计数或临床端上传。不要给出诊疗方案、处方、剂量或立项批准。若命中为 0 条，只说库内没有对上的材料，不要用库外机制、基因名或全国结论来顶替。"
      ].join("\n\n");
    }

    function litBrief(rows) {
      if (!rows || !rows.length) return "无命中条目。禁止编造编号或结论。";
      return rows.slice(0, 8).map((e, i) => {
        return `[${i + 1}] ${citeLabel(e)}｜${e.ethnicity}｜${e.topic}｜等级:${e.gradeName || e.grade || e.type || "—"}｜结论:${e.conclusion}｜边界:${e.boundary || ""}`;
      }).join("\n");
    }

    function modeTask(mode) {
      return {
        judge: "技能：辅助判断。只说明现有公开研究知道多少、够不够对照，不诊断、不开药。",
        frontier: "技能：前沿研究。只说明库内这个方向有什么、脉络与边界。",
        topic: "技能：开题对照。只看入库文献条数与覆盖，说明这题有没有人做过。",
        decide: "技能：做不做研究。三选一：可以做成课题 / 已有积累暂不必再开同类描述题 / 现在还说不清。不批准立项。",
        evidence: "技能：证据。只统计入库文献等级与设计。",
        lit: "技能：文献对照。根据命中条目说明现有材料覆盖与边界。"
      }[mode] || "技能：文献对照。";
    }

    function llmCleanText(text) {
      let t = String(text || "").replace(/\r\n/g, "\n").trim();
      t = t.replace(/现场信号不是发表证据[。．]?\s*/g, "");
      t = t.split("\n").map((line) => {
        const s = line.trim();
        if (!s) return "";
        if (/^#{0,3}\s*\*{0,2}参考来源/.test(s)) return "";
        if (/^#{0,3}\s*\*{0,2}参考文献/.test(s)) return "";
        if (/^MES-/.test(s)) return "";
        if (/^—?\s*碰到的其他文献/.test(s)) return "";
        if (/证据等级与设计分见文末/.test(s)) return "";
        return s.replace(/[^。；\n]*?(?:现场信号|脱敏计数|脱敏现场)[^。；\n]*[。；]?/g, "");
      }).filter((line) => line.replace(/^[-•]\s+/, "").trim()).join("\n");
      t = t.replace(/\n{3,}/g, "\n\n").trim();
      return t;
    }

    function llmInnerHtml(text) {
      const esc = (s) => String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      const strip = (s) => String(s || "").replace(/<[^>]+>/g, "");
      const headingOf = (line) => {
        const raw = strip(line).replace(/^#{1,3}\s+/, "").trim();
        const names = "判断摘要|理由|证据条|研究概况|说明|立项含义";
        if (new RegExp("^(" + names + ")[:：]?$").test(raw)) {
          return { name: raw.replace(/[:：]$/, ""), rest: "" };
        }
        const m = raw.match(new RegExp("^(" + names + ")[:：]\\s*(.*)$"));
        return m ? { name: m[1], rest: m[2] } : null;
      };
      const isListLine = (line) => /^([-•]|\d+[\.、])\s+/.test(strip(line));
      const listItem = (line) => line.replace(/^([-•]|\d+[\.、])\s+/, "");
      const splitSents = (s) => String(s || "").split(/(?<=[。！？])\s*/).map((x) => x.trim()).filter(Boolean);
      let t = llmCleanText(text);
      t = t.replace(/(^|\n)#{0,3}\s*\*{0,2}(判断摘要|理由|证据条|研究概况|说明|立项含义)\*{0,2}[:：]?\s*(?=\n|$)/g, "\n\n$2\n\n");
      t = t.replace(/([^\n])\n\*{0,2}(判断摘要|理由|证据条|研究概况|说明|立项含义)\*{0,2}[:：]\s*/g, "$1\n\n$2\n\n");
      t = t.replace(/\n{3,}/g, "\n\n").trim();
      t = esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      const blocks = t.split(/\n{2,}/).filter(Boolean);
      const html = [];
      let usedLead = false;
      const emitPoints = (lines, asLead) => {
        if (!lines.length) return;
        const texts = lines.map((line) => isListLine(line) ? listItem(line) : line).filter(Boolean);
        if (asLead && !usedLead) {
          const sents = splitSents(texts.join(""));
          if (sents.length) {
            html.push("<p class=\"reply-summary\">" + sents[0] + "</p>");
            usedLead = true;
            sents.slice(1).forEach((s) => html.push("<p class=\"reply-point\">" + s + "</p>"));
            return;
          }
        }
        texts.forEach((s) => {
          html.push("<p class=\"reply-point\">" + s + "</p>");
        });
      };
      blocks.forEach((block) => {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return;
        const head = headingOf(lines[0]);
        if (head) {
          html.push("<h4>" + head.name + "</h4>");
          emitPoints([head.rest].concat(lines.slice(1)).filter(Boolean), head.name === "判断摘要");
          return;
        }
        emitPoints(lines, !usedLead);
      });
      return html.join("");
    }

    function callLlm(messages) {
      const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 55000) : null;
      return fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, temperature: 0.3, max_tokens: 4096 }),
        signal: ctrl ? ctrl.signal : undefined
      }).then((r) => r.json().then((d) => {
        if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
        if (!d.content) throw new Error("空回复");
        return d;
      })).finally(() => { if (timer) clearTimeout(timer); });
    }

    function fillWithLlm(opts) {
      const { mode, text, dims, rows, fallback, seq } = opts;
      const kind = (state.assistant === "research" || mode === "topic" || mode === "decide" || mode === "evidence")
        ? "research" : "clinic";
      const userBlock = [
        modeTask(mode),
        "用户问题：" + text,
        "已解析槽位：民族=" + (dims.eth || "未点明") + "；病/药=" + (dims.topic || "未点明"),
        "命中入库文献（共 " + (rows || []).length + " 条）：\n" + litBrief(rows),
        "只根据以上入库摘要作答，不得引用论坛。"
      ].join("\n\n");
      callLlm([
        { role: "system", content: promptPack(kind, mode) },
        { role: "user", content: userBlock }
      ]).then((d) => {
        if (seq !== state.llmSeq) return;
        const pending = state.msgs.find((m) => m.pending);
        const html = clinicReplyWrap(llmInnerHtml(d.content), rows, d.mock ? `<p class="note">当前为本地 mock。</p>` : "");
        if (pending) { pending.pending = false; pending.html = html; }
        else state.msgs.push({ role: "bot", html });
        render();
      }).catch(() => {
        if (seq !== state.llmSeq) return;
        const pending = state.msgs.find((m) => m.pending);
        const html = fallback + `<p class="note">模型暂时不可用，已改用本地对照。</p>`;
        if (pending) { pending.pending = false; pending.html = html; }
        else state.msgs.push({ role: "bot", html });
        render();
      });
    }

    function resultCard(rows, mode) {
      const n = rows.length;
      const weak = n <= 2;
      const items = rows.map((e) => `<div class="hit"><b>${e.topic} · ${e.ethnicity}</b><p>${e.conclusion}</p><div class="meta">${e.type} · ${e.rec}<br>只适用于：${e.scope}<br>${e.boundary}</div></div>`).join("");
      return `<div class="statrow"><div class="stat"><em>找到的研究</em><strong>${n}</strong> 篇</div><div class="stat"><em>靠不靠谱</em><strong style="font-size:16px">${n === 0 ? "没有" : weak ? "不太靠谱" : "多为调查"}</strong></div></div>
        ${n && weak ? `<div class="warn">只有 ${n} 篇，而且是调查或观察，不够拿来开药。</div>` : ""}
        ${items || "<div class='hit'>一篇都没有。不能拿汉族或全国的结论来顶替。</div>"}`;
    }

    function ask(text, jump) {
      text = (text || "").trim();
      if (!text) return;
      const d = parse(text);
      if (d.eth) state.eth = d.eth;
      if (d.topic) state.topic = d.topic;
      if (jump === "lit") {
        state.page = "lit";
        state.query = text;
        state.litShelf = shelfForQuery(d);
        state.litDocTypes = [];
        state.litFilterOpen = false;
        state.litShowResults = !!(text || "").trim();
        render();
        return;
      }
      state.page = "home";
      state.msgs = state.msgs.filter((m) => !m.pending);
      state.msgs.push({ role: "me", text });
      if (refuse(text)) {
        state.msgs.push({ role: "bot", html: refuseHtml() });
        state.input = "";
        if (state.caseLive || state.judgeLive) state.tips = [];
        render();
        return;
      }
      const dims = { eth: d.eth || state.eth, topic: d.topic || state.topic };
      const mode = state.caseLive ? "case" : state.judgeLive ? "decide" : (state.chatMode || "lit");
      let rows = [];
      let fallback = "";
      let asked = dims;
      if (mode === "judge") {
        if (d.eth) state.clinicAsk.eth = d.eth;
        if (d.topic) state.clinicAsk.topic = d.topic;
        asked = { eth: state.clinicAsk.eth, topic: state.clinicAsk.topic };
        rows = (asked.eth && asked.topic) ? matchLit(asked.eth, asked.topic, text) : [];
        fallback = judgeHtml(rows, asked);
      } else if (mode === "topic" || mode === "evidence" || (mode === "decide" && !state.judgeLive)) {
        if (d.eth) state.researchAsk.eth = d.eth;
        if (d.topic) state.researchAsk.topic = d.topic;
        asked = { eth: state.researchAsk.eth, topic: state.researchAsk.topic };
        rows = (mode === "evidence" || (asked.eth && asked.topic))
          ? matchResearch(asked.eth, asked.topic, text)
          : [];
        if (mode === "topic") fallback = topicReply(asked, rows);
        else if (mode === "decide") fallback = decideReply(asked, rows);
        else fallback = evidenceReply(asked, rows);
      } else {
        rows = matchLit(dims.eth, dims.topic, text);
        if (!rows.length && dims.eth) rows = matchLit(dims.eth, "", text);
        if (!rows.length && dims.topic) rows = matchLit("", dims.topic, text);
        if (mode === "frontier") fallback = frontierReply(dims, rows);
        else if (mode === "case") {
          fallback = state.caseLive
            ? caseLiveAck(text, { eth: d.eth, topic: d.topic })
            : "先点「开始新对话」，说完再点一次，才会按整段记录抽关键词总结并开下一条。";
        } else if (mode === "decide") {
          fallback = state.judgeLive
            ? judgeLiveAck(text, { eth: d.eth, topic: d.topic })
            : "先点「开始新对话」，说完再点一次，才会按整段对照文献与医生上传，写入研判记录并开下一条。";
        } else fallback = resultCard(rows, "lit");
      }
      const liveAck = (mode === "case" && state.caseLive) || (mode === "decide" && state.judgeLive);
      const missing = /尚缺关键维度/.test(fallback || "");
      const useLlm = !liveAck && !missing && ["judge", "frontier", "topic", "decide", "evidence", "lit"].indexOf(mode) !== -1;
      if (useLlm) {
        const seq = ++state.llmSeq;
        state.msgs.push({ role: "bot", pending: true, html: "<p class='note'>正在对照入库文献…</p>" });
        state.input = "";
        if (state.caseLive || state.judgeLive) state.tips = [];
        render();
        fillWithLlm({ mode, text, dims: asked, rows, fallback, seq });
        return;
      }
      state.msgs.push({ role: "bot", html: fallback });
      state.input = "";
      if (state.caseLive || state.judgeLive) state.tips = [];
      render();
    }

    function caseReply(text, dims, rows, caseId) {
      const n = rows.length;
      const phen = extractPhen(text);
      const ready = !!(dims.eth && dims.topic);
      const gapLabel = !ready ? "信息不全" : n === 0 ? "文献缺口" : n <= 2 ? "证据偏弱" : "已有若干";
      return `<div class="warn">本条已写入「对话记录」。我按整段抽关键词、对照文献缺不缺，不给这个人下诊断、不开药。</div>
        <div class="hit"><b>从对话里抽出的关键词</b>
          <div class="keys">
            <span>${dims.eth || "民族未点明"}</span>
            <span>${dims.topic || "病/药未点明"}</span>
            <span>${phen}</span>
            <span>${gapLabel}</span>
          </div>
        </div>
        <div class="statrow">
          <div class="stat"><em>文献里同类</em><strong>${n}</strong> 篇</div>
          <div class="stat"><em>对照</em><strong style="font-size:14px">${gapLabel}</strong></div>
        </div>
        <div class="hit"><b>对照结论</b>
          <p>${!ready
            ? "还缺民族或病/药其中一项。可再开一条对话补全。"
            : n === 0
              ? `按现有库，${dims.eth}在「${dims.topic}」上几乎没有发表材料。不能据此说这个人有或没有某病；只能提醒：别直接套全国结论。`
              : `文献里，${dims.eth}与「${dims.topic}」有过研究/描述。你可以对照像不像，最终判断仍是你来做。`}</p>
        </div>
        ${rows.slice(0, 3).map((e) => `<div class="hit"><b>${e.topic} · ${e.ethnicity}</b><p>${e.conclusion}</p><div class="meta">${e.rec}<br>${e.scope}<br>${e.boundary}</div></div>`).join("")}`;
    }

    function signalCount(eth, topic) {
      return state.signals.filter((s) => (!eth || s.eth === eth) && (!topic || s.topic === topic)).length;
    }

    function signalBoard() {
      const map = {};
      state.signals.forEach((s) => {
        const key = s.eth + "||" + s.topic;
        if (!map[key]) map[key] = { eth: s.eth, topic: s.topic, n: 0, regions: {}, times: [], phens: [] };
        map[key].n += 1;
        if (s.region) map[key].regions[s.region] = true;
        if (s.time) map[key].times.push(s.time);
        if (s.phen) map[key].phens.push(s.phen);
      });
      return Object.values(map).map((g) => {
        const lit = match(g.eth, g.topic).length;
        const regions = Object.keys(g.regions).length;
        let rank = "先再等等";
        let tip = "医生报的还少，先别急着立项，继续看有没有人上传。";
        let action = "再观察";
        if (g.n >= 3 && lit <= 2) {
          rank = "建议优先做";
          tip = "多名医生碰到该类情况，而发表研究很少。更像「现场有、文献少」，适合考虑做成新研究。";
          action = "问：做不做";
        } else if (g.n >= 3 && lit > 2) {
          rank = "不必急着新开";
          tip = "现场仍在发生，但文献已有一定覆盖。宜先消化现有材料，不必再开同类描述题。";
          action = "问：还要不要做";
        } else if (g.n >= 2 && lit === 0) {
          rank = "可以留意";
          tip = "已有医生开始上报，库内几乎无发表材料。值得记下，观察后续是否继续增加。";
          action = "问：做不做";
        }
        return {
          eth: g.eth,
          topic: g.topic,
          n: g.n,
          lit,
          regions,
          rank,
          tip,
          action,
          latest: g.times.slice(-1)[0] || "—"
        };
      }).sort((a, b) => (b.n - a.n) || (a.lit - b.lit));
    }

    function persistSignals() {
      try { localStorage.setItem("minzheng-signals-v1", JSON.stringify(state.signals)); } catch (e) {}
    }
    (function loadSignals() {
      try {
        const raw = JSON.parse(localStorage.getItem("minzheng-signals-v1") || "null");
        if (raw && raw.length) state.signals = raw;
      } catch (e) {}
    })();

    function persistCases() {
      try { localStorage.setItem("minzheng-cases-v1", JSON.stringify(state.caseHistory)); } catch (e) {}
    }
    (function loadCases() {
      try {
        const raw = JSON.parse(localStorage.getItem("minzheng-cases-v1") || "null");
        if (raw && raw.length) {
          state.caseHistory = raw.map((c) => ({
            ...c,
            isRed: c.isRed != null ? c.isRed : (c.lit <= 2 && c.eth && c.eth !== "未点明" && c.topic && c.topic !== "未点明"),
            uploaded: !!(c.uploaded || c.confirmed),
            uploadTime: c.uploadTime || (c.confirmed ? c.time : null)
          }));
        }
      } catch (e) {}
    })();

    function topicReply(dims, rows) {
      const miss = missingDimsNote(dims, "开题对照只说明这题有没有人做过，不替代课题评审。");
      if (miss) return miss;
      const n = rows.length;
      const weak = n <= 2;
      const focus = `${dims.eth} · ${dims.topic}`;
      let lead;
      let detail;
      if (n === 0) {
        lead = `关于<strong>${focus}</strong>，库里目前<strong>几乎没有</strong>对上的发表材料。`;
        detail = `<p>这不代表全网空白，只是本库尚未收录可对上的条目。不宜据此认定「没人做过」或「必须开题」。</p>`;
      } else if (weak) {
        lead = `关于<strong>${focus}</strong>，库里目前有 <strong>${n}</strong> 条相关材料，整体<strong>偏少</strong>。`;
        detail = `<p>现有条目覆盖有限，尚不足以把该组合写成「已做透」。</p>`;
      } else {
        lead = `关于<strong>${focus}</strong>，库里目前有 <strong>${n}</strong> 条相关材料，已有一定覆盖。`;
        detail = `<p>宜先核对口径与能否跨民族横比，再决定是否重复做同类描述题。</p>`;
      }
      const body = `<p class="reply-summary">${lead}</p>${detail}${n ? evidenceMiniHtml(rows) : ""}`;
      return clinicReplyWrap(body, rows);
    }

    function evidenceReply(dims, rows) {
      const miss = missingDimsNote(dims, "证据对照只统计入库文献，不替代系统评价或课题评审。");
      if (miss) return miss;
      const n = rows.length;
      const g = evidenceGradeSummary(rows);
      const focus = `${dims.eth} · ${dims.topic}`;
      let body;
      if (!n) {
        body = `<p class="reply-summary">关于<strong>${focus}</strong>，库里<strong>没有</strong>可对上的发表条目。</p>
          <p>就证据而言，目前<strong>不足以支撑立项结论</strong>。</p>`;
      } else {
        body = `<p class="reply-summary">关于<strong>${focus}</strong>，入库 <strong>${n}</strong> 条，证据<strong>${g.level === "low" ? "整体偏低" : "有一定基础但仍须逐条核对"}</strong>。</p>
          ${evidenceMiniHtml(rows)}
          <p>${g.verdict}。分布：${g.dist}。立项时须核对 PICOS、样本量与 GRADE 边界——单条观察性通常只够探索性假说，不够支撑强结论。</p>`;
      }
      return clinicReplyWrap(body, rows);
    }

    function decideReply(dims, rows) {
      const miss = missingDimsNote(dims, "立项参考不等于课题获批。本助手不替代课题评审。");
      if (miss) return miss;
      const n = rows.length;
      const weak = n <= 2;
      const focus = `${dims.eth} · ${dims.topic}`;
      let choice = "现在还说不清";
      let reason = "库内材料不够，不能下结论。";
      if (n === 0) {
        choice = "现在还说不清";
        reason = "库内没有对上的发表材料，不能据此硬行开题，也不宜据此认定必须立项。";
      } else if (weak) {
        choice = "可以做成课题";
        reason = `入库仅 ${n} 条，多为单中心或观察性材料，覆盖有限。现有材料不足以把「已做透」当作不开题的理由。`;
      } else {
        choice = "已有积累，暂不必再开同类描述题";
        reason = `库内已有 ${n} 条相关材料。宜先核对口径、样本与能否跨民族横比，不宜仅因「感觉新」再开同类描述题。`;
      }
      state.lastJudgement = choice;
      const body = `<p class="reply-summary">关于<strong>${focus}</strong>，我的参考是：<strong>${choice}</strong>。</p>
        <p>${reason}</p>
        ${evidenceMiniHtml(rows)}
        <p class="note" style="margin-top:8px">立项参考，不替代课题评审、伦理审查或研究设计。</p>`;
      return clinicReplyWrap(body, rows);
    }

    function signalReply(dims, rows) {
      if (!dims.eth && !dims.topic) {
        return missingDimsNote(dims, "此处只说明有无医生上传过该类情况，不能据此改医嘱。");
      }
      const list = state.signals.filter((s) => (!dims.eth || s.eth === dims.eth) && (!dims.topic || s.topic === dims.topic));
      const sc = list.length;
      const n = rows.length;
      const understand = sc === 0
        ? "尚无医生上传过该类情况。"
        : sc >= 3
          ? "已有若干医生上报。可至「现场发现」继续判断是否值得做成研究。"
          : "有零星上传，可继续观察。";
      return `<div class="warn">此处只回答：有无医生上传过该类情况。不能据此改医嘱，亦不还原个案。</div>
        <div>询问范围：<strong>${dims.eth || "不限民族"} · ${dims.topic || "不限主题"}</strong></div>
        <div class="statrow" style="margin-top:8px">
          <div class="stat"><em>医生上传</em><strong>${sc}</strong> 次</div>
          <div class="stat"><em>库内文献</em><strong>${n}</strong> 条</div>
        </div>
        <div class="hit"><b>如何理解</b><p>${understand}</p></div>
        ${list.slice().reverse().map((s) => `<div class="hit"><b>${s.eth} · ${s.topic}</b><p>${s.phen}</p><div class="meta">${s.region || ""} · ${s.time} · 不写病人是谁</div></div>`).join("") || "<div class='hit'>暂无上传。</div>"}`;
    }

    function startAgent(mode) {
      const keepChat = state.msgs.some((m) => m.role === "me") && !state.caseLive && !state.judgeLive;
      if (!keepChat) state.llmSeq += 1;
      state.chatMode = mode;
      state.page = "home";
      state.caseLive = false;
      state.judgeLive = false;
      if (!keepChat) {
        state.clinicAsk = { eth: "", topic: "" };
        state.researchAsk = { eth: "", topic: "" };
        state.msgs = [];
      }
      state.tips = {
        frontier: ["最新傣族代谢有什么研究？", "傣族G6PD变异，库里有没有？"],
        judge: ["傣族用华法林后出血，现有研究够不够判断？", "傣族代谢问题，能不能套汉族结论？", "这个人该怎么治、开什么药？"],
        case: ["傣族患者，华法林相关出血现象反复出现", "维吾尔族用华法林，接诊里看到抗凝相关现象"],
        topic: ["傣族代谢这件事，已经有几篇研究？", "维吾尔族和华法林，还值不值得做成课题？"],
        decide: ["傣族华法林这题，做还是不做？", "傣族代谢，跟不跟？"],
        evidence: ["维吾尔族华法林，证据等级怎么样？", "傣族代谢，发表材料强不强？"]
      }[mode] || [];
      if (!keepChat && (mode === "judge" || mode === "frontier")) {
        state.msgs = [{
          role: "bot",
          html: mode === "judge"
            ? `${CLINIC_PROMPT.opening}请点下面的问题，或直接说明<strong>民族</strong>和<strong>病/药</strong>。对照入库研究，不替代诊疗。`
            : `下面按库内已入库条目作答。请点提示问题，或说明民族和病/药。`
        }];
      }
      if (!keepChat && (mode === "topic" || mode === "decide" || mode === "evidence")) {
        const extra = {
          topic: "对照入库文献，说明这题有没有人做过。",
          decide: "对照文献存量，给出立项参考，不替代课题评审。",
          evidence: "只统计入库文献的等级与设计。"
        }[mode];
        state.msgs = [{
          role: "bot",
          html: `${RESEARCH_PROMPT.opening}请点下面的问题，或直接说明<strong>民族</strong>和<strong>病/药</strong>。${extra}`
        }];
      }
      render();
    }

    function forumChatList() {

    function buildReport() {
      const board = signalBoard();
      const priority = board.filter((b) => b.rank === "建议优先做");
      const watch = board.filter((b) => b.rank === "可以留意");
      const covered = board.filter((b) => b.rank === "不必急着新开");
      const wait = board.filter((b) => b.rank === "先再等等");
      const shelves = SHELVES.map(([id, , name]) => ({
        name,
        n: ENTRIES.filter((e) => e.shelf === id).length
      }));
      const ethCover = countBy(ENTRIES, "ethnicity").sort((a, b) => b.n - a.n);
      const judges = (state.judgeHistory || []).slice(0, 5);
      const day = new Date().toISOString().slice(0, 10);
      const lines = [
        "多民族健康证据服务 · 选题对照报告",
        "生成日期：" + day,
        "说明：立项参考，不替代课题评审、伦理审查或研究设计。",
        "",
        "一、总体存量",
        "入库条目 " + ENTRIES.length + " 条；医生上传 " + state.signals.length + " 次；涉及情况 " + board.length + " 种。",
        "建议优先跟进 " + priority.length + " 项；可以留意 " + watch.length + " 项。",
        "",
        "二、建议优先跟进（现场多、文献少）"
      ];
      if (priority.length) {
        priority.forEach((b) => lines.push("· " + b.eth + " · " + b.topic + "：上传 " + b.n + " 次，入库 " + b.lit + " 条。" + b.tip));
      } else {
        lines.push("· 当前没有达到「建议优先做」阈值的题目。");
      }
      lines.push("", "三、可以留意 / 宜先消化已有材料");
      watch.forEach((b) => lines.push("· 可以留意：" + b.eth + " · " + b.topic + "（上传 " + b.n + "，入库 " + b.lit + "）"));
      covered.forEach((b) => lines.push("· 已有积累，暂不必再开同类描述题：" + b.eth + " · " + b.topic));
      wait.forEach((b) => lines.push("· 先再观察：" + b.eth + " · " + b.topic + "（上传 " + b.n + "，入库 " + b.lit + "）"));
      if (!watch.length && !covered.length && !wait.length) lines.push("· 现场信号尚少，宜继续观察临床端上传。");
      lines.push("", "四、入库覆盖（按四类）");
      shelves.forEach((s) => lines.push("· " + s.name + "：" + s.n + " 条"));
      lines.push("民族覆盖：" + ethCover.map((e) => e.name + e.n + "条").join("、"));
      if (judges.length) {
        lines.push("", "五、已有研判记录");
        judges.forEach((j) => lines.push("· " + j.time + " " + j.eth + " · " + j.topic + " → " + j.choice));
      }
      lines.push("", "对照口诀：医生报得多且文献很少，更值得考虑新研究；反之不宜急于立项。");
      return { board, priority, watch, covered, wait, shelves, ethCover, judges, day, text: lines.join("\n") };
    }

        <p class="note">对照口诀：医生报得多且文献很少，更值得考虑新研究；反之不宜急于立项。</p>
