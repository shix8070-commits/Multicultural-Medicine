    function promptPage() {
      const kind = state.promptKind === "research" ? "research" : "clinic";
      const p = kind === "research" ? RESEARCH_PROMPT : CLINIC_PROMPT;
      const title = kind === "research" ? "科研助手提示词" : "临床助手提示词";
      const note = kind === "research"
        ? "演示用系统提示词。开题对照与做不做研究按此约束作答。"
        : "演示用系统提示词。辅助判断按此约束作答。";
      const researchStruct = kind === "research" ? `
        <div class="prompt-sec">
          <h3>回复结构 · 开题对照</h3>
          <ol>${p.structureTopic.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>
        <div class="prompt-sec">
          <h3>回复结构 · 做不做研究</h3>
          <ol>${p.structureDecide.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>
        <div class="prompt-sec">
          <h3>回复结构 · 证据</h3>
          <ol>${p.structureEvidence.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>` : "";
      const structTitle = kind === "research" ? "回复结构（三个技能）" : "回复结构（两个技能）";
      const clinicStruct = kind === "clinic" ? `
        <div class="prompt-sec">
          <h3>回复结构 · 辅助判断</h3>
          <ol>${p.structureJudge.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>
        <div class="prompt-sec">
          <h3>回复结构 · 前沿研究</h3>
          <ol>${p.structureFrontier.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>` : "";
      return sub(title, `
        <p class="note" style="margin:0 0 10px">${note}</p>
        <div class="prompt-sec">
          <h3>角色</h3>
          <p>${p.role}</p>
        </div>
        <div class="prompt-sec">
          <h3>任务范围</h3>
          <p>${p.scope}</p>
        </div>
        <div class="prompt-sec">
          <h3>对话要求</h3>
          <ol>${p.rules.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>
        <div class="prompt-sec">
          <h3>禁止</h3>
          <ul>${p.bans.map((r) => `<li>${r}</li>`).join("")}</ul>
        </div>
        <div class="prompt-sec">
          <h3>${structTitle}</h3>
          <ol>${p.structure.map((r) => `<li>${r}</li>`).join("")}</ol>
        </div>
        ${clinicStruct}
        ${researchStruct}
        <div class="prompt-sec">
          <p>开场：${p.opening}</p>
        </div>
      `);
    }

    function favoritesPage() {
      const axis = state.favAxis || "all";
      let rows = LIT_ENTRIES.concat(ENTRIES).filter((e) => isFav(e.id));
      if (SHELVES.some((s) => s[0] === axis)) {
        rows = rows.filter((e) => e.shelf === axis);
      }
      const tabs = [["all", "全部"]].concat(SHELVES.map(([id, , name]) => [id, name]));
      let body = "";
      if (!rows.length) {
        body = `<div class="empty"><div class="folder"></div>还没有收藏<br>去文献速查看完后点星星即可</div>`;
      } else if (axis === "all") {
        body = rows.map(litCard).join("");
      } else {
        const items = countBy(rows, "ethnicity");
        if (!state.favPick) {
          body = items.map((g) => `<button class="group" data-fav-pick="${g.name}"><b>${g.name}</b><em>${g.n} 篇收藏</em></button>`).join("") || `<div class="hit">这一类暂无收藏</div>`;
        } else {
          const list = rows.filter((e) => e.ethnicity === state.favPick);
          body = `<div class="sec-h" style="padding:0;margin-bottom:8px">${state.favPick}<button type="button" id="back-fav-pick">返回</button></div>${list.map(litCard).join("")}`;
        }
      }
      return sub("我的知识库", `
        <p class="note" style="margin:0 0 10px">这里是你收藏的文献，可按与入库素材相同的四类方式浏览。</p>
        <div class="filters" style="margin-bottom:10px">
          ${tabs.map(([id, name]) => `<button type="button" data-fav-axis="${id}" class="${axis === id ? "on" : ""}">${name}</button>`).join("")}
        </div>
        ${body}
      `);
    }

    function chatPage() {
      const titles = { frontier: "前沿研究", judge: "辅助判断", case: "病例对话", lit: "对话", "": "对话" };
      const title = titles[state.chatMode] || "对话";
      const tips = state.tips || [];
      const msgs = state.msgs.map((m) =>
        `<div class="bubble ${m.role === "me" ? "me" : ""}${m.pending ? " pending" : ""}">${m.html || m.text}</div>`
      ).join("");
      return `
        <div class="sub">
          <div class="status"><span>9:41</span><span>100%</span></div>
          <div class="nav"><button data-go="home">‹</button>${title}</div>
          <div class="pad">
            <div class="chat">${msgs}</div>
            ${tips.length ? `<div class="suggest" style="padding:0 4px 8px">${tips.map((t) => `<button type="button" data-ask="${t.replace(/"/g, "&quot;")}">${t}</button>`).join("")}</div>` : ""}
          </div>
          <div class="dock">
            <div class="inputbar">
              ${svg("mic")}
              <input id="chat-in" placeholder="${state.chatMode === "frontier" ? "问：最新××有什么研究" : state.chatMode === "judge" ? "说：这个人什么情况" : state.chatMode === "case" ? "描述民族+现象" : "发送消息或按住说话"}" />
              <button class="plus" id="chat-send">+</button>
            </div>
          </div>
        </div>`;
    }

    let litComposing = false;

    function render() {
      if (state.page === "board") state.page = "home";
      const oldLit = document.getElementById("q-lit");
      const keepLit = !!(oldLit && document.activeElement === oldLit);
      const litCaret = keepLit ? oldLit.selectionStart : 0;
      const root = document.getElementById("app");
      let html = "";
      if (state.page === "home") html = home();
      if (state.page === "forum") html = forumPage();
      if (state.page === "lit") html = litPage();
      if (state.page === "litDetail") html = litDetailPage();
      if (state.page === "judgeHist") html = judgeHistPage();
      if (state.page === "history") html = historyPage();
      if (state.page === "favorites") html = favoritesPage();
      if (state.page === "prompt") html = promptPage();
      if (state.page === "chat") html = chatPage();
      root.innerHTML = html + drawerHtml();
      bind();
      if (keepLit) {
        const ql = document.getElementById("q-lit");
        if (ql) {
          ql.focus();
          const pos = Math.min(litCaret, ql.value.length);
          try { ql.setSelectionRange(pos, pos); } catch (e) {}
        }
      }
    }

    function bind() {
      const openDrawer = document.getElementById("open-drawer");
      if (openDrawer) openDrawer.onclick = () => { state.drawerOpen = true; render(); };
      const drawerMask = document.getElementById("drawer-mask");
      if (drawerMask) drawerMask.onclick = () => { state.drawerOpen = false; render(); };
      const goFavs = document.getElementById("go-favs");
      if (goFavs) {
        goFavs.onclick = () => {
          state.drawerOpen = false;
          state.page = "favorites";
          state.favAxis = "all";
          state.favPick = "";
          render();
        };
      }
      const goPrompt = document.getElementById("go-prompt");
      if (goPrompt) {
        goPrompt.onclick = () => {
          state.drawerOpen = false;
          state.promptKind = "clinic";
          state.page = "prompt";
          render();
        };
      }
      const goResearchPrompt = document.getElementById("go-research-prompt");
      if (goResearchPrompt) {
        goResearchPrompt.onclick = () => {
          state.drawerOpen = false;
          state.promptKind = "research";
          state.page = "prompt";
          render();
        };
      }
      document.querySelectorAll("[data-fav]").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          toggleFav(b.dataset.fav);
        };
      });
      document.querySelectorAll("[data-lit-open]").forEach((b) => {
        b.onclick = (e) => {
          if (e.target.closest("[data-fav]")) return;
          state.litReturnPage = state.page;
          state.litDetailId = Number(b.dataset.litOpen);
          state.page = "litDetail";
          render();
        };
      });
      const backLit = document.getElementById("back-lit");
      if (backLit) {
        backLit.onclick = () => {
          state.litDetailId = null;
          state.page = state.litReturnPage || "lit";
          render();
        };
      }
      const copyDoi = document.getElementById("copy-doi");
      if (copyDoi) {
        copyDoi.onclick = () => {
          const t = copyDoi.dataset.doi || "";
          if (navigator.clipboard && t) navigator.clipboard.writeText(t).catch(() => {});
          copyDoi.textContent = "已复制";
          setTimeout(() => { copyDoi.textContent = "复制"; }, 1200);
        };
      }
      const copyReport = document.getElementById("copy-report");
      if (copyReport) {
        copyReport.onclick = () => {
          const t = buildReport().text;
          if (navigator.clipboard && t) navigator.clipboard.writeText(t).catch(() => {});
          copyReport.textContent = "已复制";
          setTimeout(() => { copyReport.textContent = "复制报告文本"; }, 1200);
        };
      }
      document.querySelectorAll("[data-fav-axis]").forEach((b) => {
        b.onclick = () => {
          state.favAxis = b.dataset.favAxis;
          state.favPick = "";
          render();
        };
      });
      document.querySelectorAll("[data-fav-pick]").forEach((b) => {
        b.onclick = () => { state.favPick = b.dataset.favPick; render(); };
      });
      const backFavPick = document.getElementById("back-fav-pick");
      if (backFavPick) backFavPick.onclick = () => { state.favPick = ""; render(); };
      document.querySelectorAll("[data-as]").forEach((b) => {
        b.onclick = () => {
          state.drawerOpen = false;
          if (b.dataset.as === "forum") {
            state.page = "forum";
            state.forumChatId = null;
            render();
            return;
          }
          state.assistant = b.dataset.as;
          state.page = "home";
          state.chatMode = "";
          state.caseLive = false;
          state.judgeLive = false;
          state.msgs = [];
          state.tips = [];
          state.pendingSignal = null;
          render();
        };
      });
      document.querySelectorAll("[data-forum-tab]").forEach((b) => {
        b.onclick = () => {
          state.forumTab = b.dataset.forumTab;
          state.forumChatId = null;
          state.forumQuery = "";
          render();
        };
      });
      document.querySelectorAll("[data-forum-chat]").forEach((b) => {
        b.onclick = () => {
          state.forumChatId = b.dataset.forumChat;
          render();
        };
      });
      document.querySelectorAll("[data-like]").forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.like;
          state.forumLiked[id] = !state.forumLiked[id];
          render();
        };
      });
      const forumChatBack = document.getElementById("forum-chat-back");
      if (forumChatBack) forumChatBack.onclick = () => { state.forumChatId = null; render(); };
      const forumQ = document.getElementById("forum-q");
      if (forumQ) {
        forumQ.onkeydown = (e) => {
          if (e.key !== "Enter") return;
          state.forumQuery = forumQ.value;
          render();
        };
      }
      const forumDraft = document.getElementById("forum-draft");
      if (forumDraft) {
        forumDraft.oninput = () => { state.forumDraft = forumDraft.value; };
      }
      const forumPublishBtn = document.getElementById("forum-publish");
      if (forumPublishBtn) {
        forumPublishBtn.onclick = () => {
          const text = (state.forumDraft || "").trim();
          if (!text) return;
          state.forumPosts.unshift({
            id: "p" + Date.now(),
            av: "s4",
            name: state.userName,
            meta: "刚刚 · 0个回复",
            text,
            likes: 0,
            comments: 0,
            shares: 0
          });
          state.forumDraft = "";
          state.forumTab = "discover";
          render();
        };
      }
      const forumChatIn = document.getElementById("forum-chat-in");
      const forumChatSend = document.getElementById("forum-chat-send");
      if (forumChatIn && forumChatSend) {
        const sendForum = () => {
          const text = forumChatIn.value.trim();
          if (!text) return;
          const t = state.forumThreads.find((x) => x.id === state.forumChatId);
          if (!t) return;
          t.msgs.push({ role: "me", text });
          t.preview = text;
          render();
        };
        forumChatSend.onclick = sendForum;
        forumChatIn.onkeydown = (e) => { if (e.key === "Enter") sendForum(); };
      }
      document.querySelectorAll("[data-go]").forEach((b) => {
        b.onclick = () => go(b.dataset.go);
      });
      document.querySelectorAll("[data-agent]").forEach((b) => {
        b.onclick = () => startAgent(b.dataset.agent);
      });
      const startCaseBtn = document.getElementById("start-case");
      if (startCaseBtn) startCaseBtn.onclick = () => startCaseSession();
      const startJudgeBtn = document.getElementById("start-judge");
      if (startJudgeBtn) startJudgeBtn.onclick = () => startJudgeSession();
      const clearMode = document.getElementById("clear-mode");
      if (clearMode) {
        clearMode.onclick = () => {
          state.llmSeq += 1;
          state.chatMode = "";
          state.caseLive = false;
          state.judgeLive = false;
          state.msgs = [];
          state.tips = [];
          state.pendingSignal = null;
          render();
        };
      }
      document.querySelectorAll("[data-ask]").forEach((b) => {
        b.onclick = () => ask(b.dataset.ask, b.dataset.jump);
      });
      const sh = document.getElementById("shuffle");
      if (sh) sh.onclick = () => {
        const cur = Q[state.assistant];
        cur.push(cur.shift());
        render();
      };
      document.querySelectorAll("[data-eth]").forEach((b) => {
        b.onclick = () => { state.eth = b.dataset.eth; render(); };
      });
      document.querySelectorAll("[data-topic]").forEach((b) => {
        b.onclick = () => { state.topic = b.dataset.topic; render(); };
      });
      const hi = document.getElementById("home-in");
      const hs = document.getElementById("home-send");
      if (hi && hs) {
        hs.onclick = () => ask(hi.value);
        hi.onkeydown = (e) => { if (e.key === "Enter") ask(hi.value); };
      }
      const ci = document.getElementById("chat-in");
      const cs = document.getElementById("chat-send");
      if (ci && cs) {
        cs.onclick = () => ask(ci.value);
        ci.onkeydown = (e) => { if (e.key === "Enter") ask(ci.value); };
      }
      const copyLit = document.getElementById("copy-lit-src");
      if (copyLit) {
        copyLit.onclick = () => {
          const t = copyLit.dataset.copy || "";
          if (navigator.clipboard && t) navigator.clipboard.writeText(t).catch(() => {});
          copyLit.textContent = "已复制";
          setTimeout(() => { copyLit.textContent = "复制出处"; }, 1200);
        };
      }
      document.querySelectorAll("[data-lit-shelf]").forEach((b) => {
        b.onclick = () => {
          state.litShelf = b.dataset.litShelf;
          state.litDrop = false;
          state.litShowResults = false;
          state.litFilterOpen = false;
          render();
        };
      });
      document.querySelectorAll("[data-lit-dtype]").forEach((b) => {
        b.onclick = () => {
          const id = b.dataset.litDtype;
          if (state.litDocTypes.includes(id)) state.litDocTypes = state.litDocTypes.filter((x) => x !== id);
          else state.litDocTypes = state.litDocTypes.concat(id);
          render();
        };
      });
      document.querySelectorAll("[data-lit-grade]").forEach((b) => {
        b.onclick = () => {
          const g = b.dataset.litGrade;
          state.litGrade = state.litGrade === g ? "" : g;
          render();
        };
      });
      const drop = document.getElementById("lit-drop");
      if (drop) drop.onclick = () => { state.litDrop = !state.litDrop; render(); };
      const mask = document.getElementById("lit-mask");
      if (mask) mask.onclick = () => { state.litDrop = false; render(); };
      const litToggleFilter = document.getElementById("lit-toggle-filter");
      if (litToggleFilter) {
        litToggleFilter.onclick = () => {
          state.litFilterOpen = !state.litFilterOpen;
          render();
        };
      }
      const litFilterReset = document.getElementById("lit-filter-reset");
      if (litFilterReset) {
        litFilterReset.onclick = () => {
          state.litDocTypes = [];
          state.litGrade = "";
          render();
        };
      }
      const litFilterOk = document.getElementById("lit-filter-ok");
      if (litFilterOk) {
        litFilterOk.onclick = () => {
          state.litFilterOpen = false;
          state.litShowResults = true;
          render();
        };
      }
      const ql = document.getElementById("q-lit");
      if (ql) {
        ql.addEventListener("compositionstart", () => { litComposing = true; });
        ql.addEventListener("compositionend", () => {
          litComposing = false;
          const wasEmpty = !(state.query || "").trim();
          state.query = ql.value;
          const nowEmpty = !(state.query || "").trim();
          if (wasEmpty !== nowEmpty) render();
        });
        ql.oninput = () => {
          if (litComposing) {
            state.query = ql.value;
            return;
          }
          const wasEmpty = !(state.query || "").trim();
          state.query = ql.value;
          const nowEmpty = !(state.query || "").trim();
          if (wasEmpty !== nowEmpty) render();
        };
        ql.onkeydown = (e) => {
          if (e.key !== "Enter") return;
          if (litComposing) return;
          if (!(ql.value || "").trim() || !state.litShelf) return;
          state.query = ql.value;
          state.litShowResults = true;
          state.litFilterOpen = false;
          render();
        };
      }
      document.querySelectorAll("[data-history]").forEach((b) => {
        b.onclick = () => {
          state.historyId = b.dataset.history;
          state.page = "history";
          render();
        };
      });
      const backHist = document.getElementById("back-history");
      if (backHist) {
        backHist.onclick = () => {
          state.historyId = null;
          state.page = "history";
          render();
        };
      }
      document.querySelectorAll("[data-judge]").forEach((b) => {
        b.onclick = () => {
          state.judgeId = b.dataset.judge;
          state.page = "judgeHist";
          render();
        };
      });
      const backJudge = document.getElementById("back-judge-hist");
      if (backJudge) {
        backJudge.onclick = () => {
          state.judgeId = null;
          state.page = "judgeHist";
          render();
        };
      }
    }

    probeLlm();
    render();
  </script>
</body>
</html>
